name: Verify

on:
  pull_request:
  push:
    # `main` is covered by the deploy workflow, which verifies before publishing.
    # `gh-pages` holds build output and has no package.json — running here would
    # fail on every deploy.
    branches-ignore: [main, gh-pages]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run verify
