name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Typecheck and build, then the checks the build cannot do: unresolved
      # citations, missing graph nodes, quizzes with the wrong answer index.
      - run: npm run verify
        env:
          VITE_ATLAS_API: ${{ vars.ATLAS_API_URL }}

      # GitHub Pages has no SPA rewrite, so a deep link would 404 on reload.
      # Serving the app as the 404 body makes every path work.
      - run: cp dist/index.html dist/404.html

      # `enablement` turns Pages on via the API using the pages:write permission
      # above. Without it the first run of this workflow on a fresh repository
      # fails with "Get Pages site failed", because nobody has visited Settings →
      # Pages yet to switch the source to GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
