name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing works by force-pushing the build to the `gh-pages` branch, which is
# what this repository's Pages source is actually set to.
#
# The alternative — the artifact route, with configure-pages / upload-pages-artifact
# / deploy-pages — is tidier and gives you a real deployment record. It also
# requires Settings → Pages → Source to be "GitHub Actions", and switching that
# needs a browser, since the GitHub mobile app has no repository settings at all.
# Every run of the previous workflow failed on that one step while the site sat
# there serving a stale branch. A deploy that needs a manual prerequisite nobody
# can reach is not a deploy.
#
# To move to the artifact route later: set the Pages source to GitHub Actions,
# then restore the configure-pages/upload-pages-artifact/deploy-pages steps and
# delete the gh-pages branch.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Typecheck and build, then the checks the build cannot do: unresolved
      # citations, missing graph nodes, quizzes with the wrong answer index,
      # reels that have drifted back into being articles.
      - run: npm run verify
        env:
          VITE_ATLAS_API: ${{ vars.ATLAS_API_URL }}

      # Pages has no SPA rewrite, so a deep link would 404 on reload. Serving the
      # app as the 404 body makes every path work. `.nojekyll` stops the legacy
      # Pages build from touching anything.
      - name: Prepare for static hosting
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
