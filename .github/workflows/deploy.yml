name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Typecheck and build, then the checks the build cannot do: unresolved
      # citations, missing graph nodes, quizzes with the wrong answer index.
      - run: npm run verify
        env:
          VITE_ATLAS_API: ${{ vars.ATLAS_API_URL }}

      # GitHub Pages has no SPA rewrite, so a deep link would 404 on reload.
      # Serving the app as the 404 body makes every path work.
      - run: cp dist/index.html dist/404.html

      # On a repository where Pages has never been configured, this step fails
      # with "Get Pages site failed". `enablement: true` asks the action to
      # create the site itself, which works only where the workflow token is
      # allowed to — on a fresh personal repository GITHUB_TOKEN is refused with
      # "Resource not accessible by integration".
      #
      # If that happens, it is a one-time manual step and not a workflow bug:
      # Settings → Pages → Build and deployment → Source: GitHub Actions. Then
      # re-run this workflow. Every push after that deploys with no interaction.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
